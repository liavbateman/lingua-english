<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080d26">
  <!-- iPhone: "Add to Home Screen" opens the app full screen, without Safari's bars -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lingua">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/png" href="icons/favicon.png">
  <link rel="apple-touch-icon" href="icons/owl-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Lingua</title>
  <!-- One font for Hebrew and English, so text looks the same on every device -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    // iPhone home-screen app: with the see-through status bar, iOS reports a page height that is
    // shorter than the screen, leaving an empty strip under the tab bar. Use the real screen height.
    (function () {
      if (navigator.standalone !== true) return;   // iPhone/iPad home-screen app only
      var root = document.documentElement;
      function fit() {
        var land = matchMedia('(orientation: landscape)').matches;
        var h = land ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height);
        root.style.setProperty('--app-h', h + 'px');
      }
      root.classList.add('ios-app');
      fit();
      addEventListener('resize', fit);
      addEventListener('orientationchange', fit);
    })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Texts marked data-t are filled in from js/i18n.js in the chosen language -->
  <header class="topbar">
    <a class="brand" href="#/"><img class="logo" src="icons/logo.png" alt="" width="36" height="36">LINGUA</a>
    <div class="topbar-side">
      <span class="streak">🔥 <b id="stat-streak">0</b><span id="stat-streak-label"></span></span>
      <button class="lang" id="lang" data-t-aria="aria.lang">EN</button>
    </div>
  </header>

  <!-- Lesson focus mode: replaces the header and tab bar while an exercise is running -->
  <div class="lessonbar" id="lessonbar">
    <button class="lb-close" id="lb-close" data-t-aria="lesson.close">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="lb-track" id="lb-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="lb-fill"></i></div>
  </div>

  <main id="view" class="view"></main>
  <!-- Short spoken messages for screen readers (right / wrong answer) -->
  <div id="sr-live" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <!-- Three screens only: Home = today, Learn = everything to study, Progress = the numbers -->
  <nav class="tabbar">
    <a href="#/" data-tab="home">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2.500 11.200V21h6.500v-6h6v6h6.500v-9.800z"/></svg><span data-t="nav.home"></span>
    </a>
    <a href="#/learn" data-tab="learn">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 6.500C10 5 7 4.500 3.500 5v13.500c3.500-.5 6.500 0 8.500 1.500 2-1.500 5-2 8.500-1.500V5C17 4.500 14 5 12 6.500zM12 6.500V20"/></svg><span data-t="nav.learn"></span>
    </a>
    <a href="#/progress" data-tab="progress">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><rect x="3.500" y="13" width="4.500" height="8" rx="1.200"/><rect x="9.800" y="8" width="4.500" height="13" rx="1.200"/><rect x="16" y="3" width="4.500" height="18" rx="1.200"/></svg><span data-t="nav.progress"></span>
    </a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/grammar.js"></script>
  <script src="js/content-beginner.js"></script>
  <script src="js/content-intermediate.js"></script>
  <script src="js/content-advanced.js"></script>
  <script src="js/content-index.js"></script>
  <script src="js/store.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Feels like an app: no pinch or double-tap zoom, no copy menu on a long press (typing fields still work)
    (() => {
      const typing = el => el && el.closest && el.closest('input, textarea, [contenteditable]');
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
        document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
      document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
      document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
      document.addEventListener('contextmenu', e => { if (!typing(e.target)) e.preventDefault(); });
      document.addEventListener('selectstart', e => { if (!typing(e.target)) e.preventDefault(); });
    })();
    if ('serviceWorker' in navigator) {
      // Already running from the offline copy? Then a controller change means a new version took over.
      const hadCopy = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (hadCopy) window.dispatchEvent(new Event('app-updated'));
      });
      const reg = navigator.serviceWorker.register('sw.js');
      reg.catch(() => {});
      // An installed app on the phone is usually resumed, not reloaded, so the browser never looks
      // for a new version by itself. Look every time the app comes back to the screen.
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.then(r => r.update()).catch(() => {});
      });
    }
  </script>
</body>
</html>
